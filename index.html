  { id: "d5", icon: " 🧠",label: "Aptitudes", sub: "1 hour" }
];

const CAT_BAR = { webdev: "cat-webdev", dsa: "cat-dsa", cs: "cat-cs", java: "cat-java" };
const CAT_BADGE = { webdev: "badge-webdev", dsa: "badge-dsa", cs: "badge-cs", java: "badge-java" };
const CAT_LABEL = { webdev: "Web Dev", dsa: "DSA", cs: "CS Fundamentals", java: "Java" };

function getTodayKey() { return new Date().toISOString().split("T")[0]; }

function loadState() {
  return JSON.parse(localStorage.getItem("pihu_tracker") || "{}");
}
function saveState(state) {
  localStorage.setItem("pihu_tracker", JSON.stringify(state));
}

function renderDaily() {
  const today = getTodayKey();
  const state = loadState();
  const dailyState = state.daily || {};
  const todayData = dailyState[today] || {};

  document.getElementById("todayLabel").textContent = "📅 Today — " + new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const container = document.getElementById("dailyBlocks");
  container.innerHTML = "";
  DAILY.forEach(d => {
    const checked = !!todayData[d.id];
    const div = document.createElement("div");
    div.className = "daily-card";
    div.innerHTML = `<div class="icon">${d.icon}</div><div class="info"><div>${d.label}</div><div>${d.sub}</div></div><input type="checkbox" ${checked ? "checked" : ""} onchange="toggleDaily('${d.id}', this.checked)">`;
    container.appendChild(div);
  });
}

function toggleDaily(id, val) {
  const today = getTodayKey();
  const state = loadState();
  if (!state.daily) state.daily = {};
  if (!state.daily[today]) state.daily[today] = {};
  state.daily[today][id] = val;
  saveState(state);
}

function resetDaily() {
  const today = getTodayKey();
  const state = loadState();
  if (state.daily) state.daily[today] = {};
  saveState(state);
  renderDaily();
}

function renderPhases() {
  const state = loadState();
  const topics = state.topics || {};
  const container = document.getElementById("phasesGrid");
  container.innerHTML = "";

  let totalTopics = 0, completedTopics = 0;

  PHASES.forEach(phase => {
    const phaseTopics = topics[phase.id] || {};
    const total = phase.topics.length;
    const done = phase.topics.filter((_, i) => phaseTopics[i]).length;
    totalTopics += total;
    completedTopics += done;
    const pct = Math.round((done / total) * 100);
    const isDone = done === total;

    const card = document.createElement("div");
    card.className = `phase-card ${isDone ? "done" : done > 0 ? "active" : ""}`;

    const topicsHTML = phase.topics.map((t, i) => {
      const checked = !!phaseTopics[i];
      return `<li class="${checked ? "checked" : ""}" onclick="toggleTopic('${phase.id}', ${i})">
        <input type="checkbox" ${checked ? "checked" : ""} onclick="event.stopPropagation(); toggleTopic('${phase.id}', ${i})">
        ${t}
      </li>`;
    }).join("");

    card.innerHTML = `
      <div class="phase-header">
        <span class="phase-icon">${phase.icon}</span>
        <div>
          <div class="phase-title">${phase.title} <span class="badge ${CAT_BADGE[phase.cat]}">${CAT_LABEL[phase.cat]}</span></div>
          <div class="phase-days">${phase.days} · ${phase.topics.length} topics</div>
        </div>
      </div>
      <div class="phase-milestone">${phase.milestone}</div>
      <div class="phase-bar"><div class="phase-bar-fill ${CAT_BAR[phase.cat]}" style="width:${pct}%"></div></div>
      <ul class="topics-list">${topicsHTML}</ul>
      <div class="phase-stats">${done} / ${total} completed · ${pct}%</div>
      <div class="milestone-banner">🎉 Phase Complete! ${phase.milestone}</div>
    `;
    container.appendChild(card);
  });

  const overallPct = totalTopics > 0 ? Math.round((completedTopics / totalTopics) * 100) : 0;
  document.getElementById("overallBar").style.width = overallPct + "%";
  document.getElementById("overallPercent").textContent = overallPct + "%";
  document.getElementById("overallCount").textContent = completedTopics + " / " + totalTopics + " topics completed";
}

function toggleTopic(phaseId, idx) {
  const state = loadState();
  if (!state.topics) state.topics = {};
  if (!state.topics[phaseId]) state.topics[phaseId] = {};
  state.topics[phaseId][idx] = !state.topics[phaseId][idx];
  saveState(state);
  renderPhases();
}

renderDaily();
renderPhases();
</script>
</body>
</html>
